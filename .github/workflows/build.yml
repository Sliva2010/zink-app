name: Build ZINK APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.32.4
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Resolve GigaChat credentials
        id: creds
        shell: bash
        run: |
          # Если секреты заданы — берём их. Если нет — оставляем пустую строку,
          # тогда в коде сработает defaultValue из app_config.dart.
          AUTH_KEY="${{ secrets.GIGACHAT_AUTH_KEY }}"
          CLIENT_ID="${{ secrets.GIGACHAT_CLIENT_ID }}"
          SCOPE="${{ secrets.GIGACHAT_SCOPE }}"
          MODEL="${{ secrets.GIGACHAT_MODEL }}"
          {
            echo "auth_key=$AUTH_KEY"
            echo "client_id=$CLIENT_ID"
            echo "scope=$SCOPE"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK (split per ABI)
        shell: bash
        run: |
          ARGS=()
          [ -n "${{ steps.creds.outputs.auth_key }}" ] && ARGS+=(--dart-define=GIGACHAT_AUTH_KEY="${{ steps.creds.outputs.auth_key }}")
          [ -n "${{ steps.creds.outputs.client_id }}" ] && ARGS+=(--dart-define=GIGACHAT_CLIENT_ID="${{ steps.creds.outputs.client_id }}")
          [ -n "${{ steps.creds.outputs.scope }}" ] && ARGS+=(--dart-define=GIGACHAT_SCOPE="${{ steps.creds.outputs.scope }}")
          [ -n "${{ steps.creds.outputs.model }}" ] && ARGS+=(--dart-define=GIGACHAT_MODEL="${{ steps.creds.outputs.model }}")
          flutter build apk --release --split-per-abi "${ARGS[@]}"

      - name: Build universal APK (all ABIs)
        shell: bash
        run: |
          ARGS=()
          [ -n "${{ steps.creds.outputs.auth_key }}" ] && ARGS+=(--dart-define=GIGACHAT_AUTH_KEY="${{ steps.creds.outputs.auth_key }}")
          [ -n "${{ steps.creds.outputs.client_id }}" ] && ARGS+=(--dart-define=GIGACHAT_CLIENT_ID="${{ steps.creds.outputs.client_id }}")
          [ -n "${{ steps.creds.outputs.scope }}" ] && ARGS+=(--dart-define=GIGACHAT_SCOPE="${{ steps.creds.outputs.scope }}")
          [ -n "${{ steps.creds.outputs.model }}" ] && ARGS+=(--dart-define=GIGACHAT_MODEL="${{ steps.creds.outputs.model }}")
          flutter build apk --release "${ARGS[@]}"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk           artifacts/zink-universal-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/zink-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   artifacts/zink-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      artifacts/zink-x86_64-release.apk
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zink-release-apks
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
